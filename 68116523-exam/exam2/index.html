<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Feedback</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h2>💬 แบบฟอร์มข้อเสนอแนะ</h2>

<form>

<label>กรุณาเขียนข้อร้องเรียนหรือข้อเสนอแนะ</label>

<textarea 
id="feedback" 
maxlength="200"
placeholder="พิมพ์ข้อความได้ไม่เกิน 200 ตัวอักษร...">
</textarea>

<div class="counter">
<span id="charCount">0</span> / 200 ตัวอักษร
</div>

<button type="submit">ส่งข้อเสนอแนะ</button>

</form>

</div>

<script src="app.js"></script>

<footer>

    </footer>
</body>
</html>
