<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>TNT FASHION</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f8f8f8;
font-family:Arial;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 50px;
background:black;
color:white;
}

.logo{
font-size:24px;
font-weight:bold;
}

nav a{
color:white;
margin-left:20px;
text-decoration:none;
}

nav a:hover{
color:orange;
}

.container{
padding:40px;
}

.product-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.product{
background:white;
padding:15px;
text-align:center;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.product img{
width:100%;
border-radius:10px;
}

</style>

</head>

<body>

<header>

<div class="logo">TNT FASHION</div>

<nav>
<a href="/">Home</a>
<a href="/products/">Products</a>
<a href="/feedback/">Feedback</a>
</nav>

</header>

<div class="container">

{% block content %}
{% endblock %}

</div>

</body>
</html>
